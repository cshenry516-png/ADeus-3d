<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADeus 3D</title>
<style>
body{font-family:Arial,sans-serif;background:#14161B;color:#ECEAE4;min-height:100vh;margin:0;padding:24px 16px}.container{max-width:760px;margin:auto}h1{text-align:center}.tabs{display:flex;gap:4px;border-bottom:1px solid #333846;margin-bottom:20px}.tabs button{flex:1;padding:12px;border:0;background:transparent;color:#9096A3;cursor:pointer}.tabs button.active{color:#FF7A45;border-bottom:2px solid #FF7A45}.card{background:#1E212A;border:1px solid #333846;border-radius:10px;padding:18px;margin-bottom:14px}.field{margin-bottom:12px}label{display:block;color:#9096A3;margin-bottom:5px}input{width:100%;box-sizing:border-box;padding:10px;background:#262A34;border:1px solid #333846;border-radius:8px;color:#ECEAE4}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{text-align:center;border-top:3px solid #FF7A45}.price{font-size:2.2rem;font-weight:bold;color:#FF7A45}.btn{width:100%;padding:12px;background:#FF7A45;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.tab{display:none}.tab.active{display:block}.muted{color:#9096A3;font-size:.85rem}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{text-align:center;background:#1E212A;border:1px solid #333846;border-radius:10px;padding:14px}.value{font-weight:bold;margin-top:5px}.item{padding:12px;border:1px solid #333846;border-radius:10px;margin:8px 0}.ok{color:#3ECF8E}.warn{color:#F5B942}@media(max-width:600px){.row,.summary{grid-template-columns:1fr}.tabs button{font-size:.8rem}}
</style>
</head>
<body><div class="container">
<h1>🖨️ ADeus 3D</h1><p class="muted" style="text-align:center">Precifique suas peças e controle vendas e pagamentos</p>
<div class="tabs"><button class="active" onclick="tab('calc',this)">🧮 Calculadora</button><button onclick="tab('sales',this)">💰 Vendas</button><button onclick="tab('stock',this)">📦 Estoque</button></div>
<section id="calc" class="tab active">
<div class="card"><h2>🏷️ Item</h2><div class="field"><label>Nome do item / peça</label><input id="item" placeholder="Ex: Vaso geométrico P"></div><div class="field"><label>Quantidade</label><input id="qty" type="number" value="1" min="1"></div></div>
<div class="card"><h2>📦 Filamento</h2><div class="row"><div class="field"><label>Preço do rolo (R$/kg)</label><input id="fil" type="number" value="120"></div><div class="field"><label>Peso usado (g)</label><input id="grams" type="number" value="50"></div></div></div>
<div class="card"><h2>⏱️ Tempo e Energia</h2><div class="row"><div class="field"><label>Horas</label><input id="hours" type="number" value="4"></div><div class="field"><label>Minutos</label><input id="mins" type="number" value="0"></div></div><div class="field"><label>Potência média (W)</label><input id="power" type="number" value="95"></div><div class="field"><label>Energia (R$/kWh)</label><input id="energy" type="number" value="0.768" step="0.001"></div></div>
<div class="card"><h2>🔧 Desgaste da Impressora</h2><div class="row"><div class="field"><label>Valor da impressora (R$)</label><input id="printer" type="number" value="3529"></div><div class="field"><label>Vida útil (horas)</label><input id="life" type="number" value="5000"></div></div></div>
<div class="card"><h2>👤 Mão de Obra</h2><div class="row"><div class="field"><label>Valor da hora (R$)</label><input id="labor" type="number" value="20"></div><div class="field"><label>Preparo (minutos)</label><input id="setup" type="number" value="15"></div></div></div>
<div class="card"><h2>📊 Margens</h2><div class="row"><div class="field"><label>Taxa de falha (%)</label><input id="fail" type="number" value="10"></div><div class="field"><label>Margem de lucro (%)</label><input id="margin" type="number" value="30"></div></div></div>
<div class="card result"><div>PREÇO SUGERIDO / UNIDADE</div><div id="price" class="price">R$ 0,00</div><div id="detail" class="muted"></div><button class="btn" onclick="registerPrint()">✅ Registrar impressão</button></div>
</section>
<section id="sales" class="tab"><div class="card"><h2>➕ Nova Venda</h2><div class="field"><label>Cliente</label><input id="client"></div><div class="field"><label>Produto</label><input id="saleitem"></div><div class="field"><label>Valor (R$)</label><input id="salevalue" type="number"></div><div class="field"><label>Quantidade</label><input id="saleqty" type="number" value="1"></div><button class="btn" onclick="addSale()">Adicionar venda</button></div><div class="summary"><div class="box"><div class="muted">Total</div><div id="total" class="value">R$ 0,00</div></div><div class="box"><div class="muted">Recebido</div><div id="received" class="value ok">R$ 0,00</div></div><div class="box"><div class="muted">A receber</div><div id="pending" class="value warn">R$ 0,00</div></div></div><div id="saleslist" style="margin-top:14px"></div></section>
<section id="stock" class="tab"><div class="card"><h2>📦 Estoque</h2><div class="field"><label>Produto</label><input id="stockitem"></div><div class="field"><label>Quantidade</label><input id="stockqty" type="number" value="1"></div><button class="btn" onclick="addStock()">➕ Adicionar ao estoque</button></div><div id="stocklist"></div></section>
</div>
<script>
const money=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='sales')renderSales();if(id==='stock')renderStock()}
const ids=['fil','grams','hours','mins','power','energy','printer','life','labor','setup','fail','margin','qty','item'];ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));
function calc(){let q=Math.max(1,+qty.value||1),t=(+hours.value||0)+(+mins.value||0)/60;let base=(+grams.value||0)/1000*(+fil.value||0)+(+power.value||0)/1000*t*(+energy.value||0)+(+printer.value||0)/Math.max(1,+life.value||1)*t+(+setup.value||0)/60*(+labor.value||0);let failv=Math.min(99,Math.max(0,+fail.value||0)),m=Math.min(99,Math.max(0,+margin.value||30));let total=base/(1-failv/100)/(1-m/100);price.textContent=money(total/q);detail.textContent='Custo do lote: '+money(base)+' • Preço total: '+money(total)+' • Lucro estimado: '+money(total-base);window.current={item:item.value.trim(),q,price:total/q,base,total}}
function registerPrint(){if(!window.current)return;let s=JSON.parse(localStorage.getItem('stock')||'{}');let k=window.current.item.toLowerCase();if(k){s[k]=s[k]||{name:window.current.item,qty:0};s[k].qty+=window.current.q;localStorage.setItem('stock',JSON.stringify(s));alert('Impressão registrada e estoque atualizado.')}}
function addSale(){let c=client.value.trim(),it=saleitem.value.trim(),v=+salevalue.value||0,q=Math.max(1,+saleqty.value||1);if(!c||!it||v<=0){alert('Preencha cliente, produto e valor.');return}let a=JSON.parse(localStorage.getItem('sales')||'[]');a.unshift({id:Date.now(),client:c,item:it,value:v,qty:q,pago:true});localStorage.setItem('sales',JSON.stringify(a));client.value='';saleitem.value='';salevalue.value='';renderSales()}
function renderSales(){let a=JSON.parse(localStorage.getItem('sales')||'[]');let t=a.reduce((s,x)=>s+x.value,0),r=a.filter(x=>x.pago).reduce((s,x)=>s+x.value,0);total.textContent=money(t);received.textContent=money(r);pending.textContent=money(t-r);saleslist.innerHTML=a.map(x=>`<div class="item"><b>${x.client}</b><br><span class="muted">${x.item} × ${x.qty}</span><br>${money(x.value)} <button onclick="toggleSale(${x.id})">${x.pago?'✅ Pago':'⏳ Pendente'}</button> <button onclick="delSale(${x.id})">🗑️</button></div>`).join('')}
function toggleSale(id){let a=JSON.parse(localStorage.getItem('sales')||'[]');let x=a.find(x=>x.id===id);if(x)x.pago=!x.pago;localStorage.setItem('sales',JSON.stringify(a));renderSales()}
function delSale(id){let a=JSON.parse(localStorage.getItem('sales')||'[]').filter(x=>x.id!==id);localStorage.setItem('sales',JSON.stringify(a));renderSales()}
function addStock(){let n=stockitem.value.trim(),q=Math.max(1,+stockqty.value||1);if(!n)return;let s=JSON.parse(localStorage.getItem('stock')||'{}'),k=n.toLowerCase();s[k]=s[k]||{name:n,qty:0};s[k].qty+=q;localStorage.setItem('stock',JSON.stringify(s));stockitem.value='';renderStock()}
function renderStock(){let s=JSON.parse(localStorage.getItem('stock')||'{}');stocklist.innerHTML=Object.entries(s).map(([k,x])=>`<div class="item"><b>${x.name}</b> — ${x.qty} un <button onclick="changeStock('${k}',-1)">−</button><button onclick="changeStock('${k}',1)">+</button></div>`).join('')}
function changeStock(k,d){let s=JSON.parse(localStorage.getItem('stock')||'{}');if(s[k])s[k].qty=Math.max(0,s[k].qty+d);localStorage.setItem('stock',JSON.stringify(s));renderStock()}
calc();renderSales();renderStock();
</script></body></html>
